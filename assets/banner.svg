<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="900" height="220" fill="#0d1b2a"/>
  <rect width="900" height="220" fill="url(#scan)"/>

  <!-- pixel frame border -->
  <g fill="#39ff14">
    <rect x="0" y="0" width="900" height="6"/>
    <rect x="0" y="214" width="900" height="6"/>
    <rect x="0" y="0" width="6" height="220"/>
    <rect x="894" y="0" width="6" height="220"/>
    <rect x="0" y="0" width="18" height="18"/>
    <rect x="882" y="0" width="18" height="18"/>
    <rect x="0" y="202" width="18" height="18"/>
    <rect x="882" y="202" width="18" height="18"/>
  </g>

  <!-- title -->
  <text x="450" y="78" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold"
        font-size="34" letter-spacing="6" fill="#39ff14">VINICIUS ALVES DA SILVA</text>

  <!-- blinking cursor next to title -->
  <rect x="772" y="55" width="14" height="26" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="450" y="112" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="16" letter-spacing="5" fill="#7fe08a">DESENVOLVEDOR BACKEND · PYTHON &amp; DJANGO</text>

  <!-- ground line -->
  <line x1="18" y1="180" x2="882" y2="180" stroke="#123524" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- walking pixel character -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-40 0; 940 0" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(0,140) scale(2.2)">
      <!-- head -->
      <rect x="6" y="0" width="12" height="12" fill="#39ff14"/>
      <!-- body -->
      <rect x="6" y="12" width="12" height="12" fill="#39ff14"/>
      <!-- backpack accent -->
      <rect x="18" y="13" width="4" height="8" fill="#1f8f3a"/>
      <!-- legs frame A -->
      <g>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.4s" repeatCount="indefinite"/>
        <rect x="6" y="24" width="6" height="7" fill="#39ff14"/>
        <rect x="12" y="24" width="6" height="7" fill="#39ff14"/>
      </g>
      <!-- legs frame B -->
      <g>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="0.4s" repeatCount="indefinite"/>
        <rect x="2" y="24" width="6" height="7" fill="#39ff14"/>
        <rect x="16" y="24" width="6" height="7" fill="#39ff14"/>
      </g>
    </g>
  </g>
</svg>
